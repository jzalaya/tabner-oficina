<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef0">
<title>Oficina de bots · Tabner, Shorts y más</title>
<style>
:root{
  --ink:#16181d; --ink2:#3b4049; --mut:#6d737d; --mut2:#9aa0a8;
  --panel:rgba(255,255,255,.84); --panelSolid:#ffffff; --line:rgba(20,24,33,.07); --hover:rgba(20,24,33,.04);
  --shadow:0 10px 34px rgba(30,38,52,.10), 0 1px 2px rgba(30,38,52,.06);
  --bg1:#f3f4f5; --bg2:#e2e5e9;
  --activo:#22b25b; --pausado:#e09d2f; --bloqueado:#e5533d; --hecho:#2a9d8f;
  --floorA:#f6f5f2; --floorB:#e8e6e1; --grid:rgba(60,50,30,.035);
  --wallB:#f7f6f3; --wallB2:#eeece7; --wallL:#e9e7e2; --wallTop:#ffffff; --wallEnd:#d9d6cf; --wallEnd2:#cfccc5;
  --slabL:#dad7d0; --slabR:#c8c5be; --base:#e1ded8;
  --deskT:#fdfdfc; --deskL:#ecebe7; --deskR:#d6d4cf;
  --chT:#3a3d43; --chL:#2a2c31; --chR:#1c1d21;
  --dark1:#2f3238; --dark2:#23252a; --dark3:#18191c;
  --sofaT:#dfe3e2; --sofaL:#ccd2d1; --sofaR:#b8bfbe;
  --shelfBack:#e4e0d8; --woodT:#f2eee7; --woodL:#e2ddd3; --woodR:#cfc9be;
  --skyA:#bfe0fa; --skyB:#eef6fd; --frame:#ffffff;
  --signInk:#1d2026; --scrOff:#454a52; --tvBg:#1b1e24;
  --daylight:.42; --night:0;
}
body.night{
  --ink:#eef1f6; --ink2:#c9ced8; --mut:#9aa3b2; --mut2:#727b8a;
  --panel:rgba(26,30,40,.82); --panelSolid:#232836; --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.05);
  --shadow:0 10px 34px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --bg1:#1d2330; --bg2:#121620;
  --floorA:#474d5a; --floorB:#3a3f4b; --grid:rgba(255,255,255,.03);
  --wallB:#4b5262; --wallB2:#434958; --wallL:#3f4554; --wallTop:#5b6273; --wallEnd:#353a47; --wallEnd2:#2f3440;
  --slabL:#323743; --slabR:#2a2e38; --base:#3b404d;
  --deskT:#626a79; --deskL:#535a68; --deskR:#454b57;
  --sofaT:#57606a; --sofaL:#4b535d; --sofaR:#3f464f;
  --shelfBack:#3c4250; --woodT:#5e6573; --woodL:#4f5562; --woodR:#434855;
  --skyA:#101a33; --skyB:#2a3a5e; --frame:#6a7283;
  --signInk:#f1f3f7; --scrOff:#2f333a;
  --daylight:0; --night:1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:radial-gradient(120% 90% at 50% 40%, var(--bg1), var(--bg2));
  -webkit-font-smoothing:antialiased; overflow:hidden; transition:background .6s;
  font-size:13px; line-height:1.35;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.card{background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* stage */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}
#world.ease{transition:transform .65s cubic-bezier(.3,.7,.2,1),opacity .17s ease}
#world,#labels{transition:opacity .17s ease}
#stage.swap #world,#stage.swap #labels{opacity:0}
#labels{position:absolute;inset:0;pointer-events:none}
#labels.ease .nm{transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.nm{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
  font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--ink2);
  padding:2px 7px 2px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(30,38,52,.08);display:flex;align-items:center;gap:5px;transition:opacity .35s, background .2s}
.nm i{width:6px;height:6px;border-radius:50%;background:var(--mut2)}
.nm.sel{background:var(--ink);color:var(--panelSolid);border-color:transparent}
body.night .nm.sel{background:#f1f3f7;color:#1b1f29}
#tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;max-width:240px;padding:7px 10px;border-radius:10px;
  background:rgba(22,24,29,.92);color:#fff;font-size:12px;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#tip b{display:block;font-size:12px;margin-bottom:1px}
#tip span{opacity:.75}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:320px;text-align:center;padding:18px 20px;pointer-events:none}
#empty b{display:block;font-size:15px;margin-bottom:4px}
#empty span{color:var(--mut)}
#zoom{position:absolute;right:342px;bottom:14px;display:flex;flex-direction:column;gap:2px;padding:3px}
#zoom button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--ink2)}
#zoom button:hover{background:var(--hover)}

/* svg room */
.f-floor{fill:url(#gFloor)} .f-wallB{fill:url(#gWallB)} .f-wallL{fill:var(--wallL)} .f-wallTop{fill:var(--wallTop)}
.f-wallEnd{fill:var(--wallEnd)} .f-wallEnd2{fill:var(--wallEnd2)} .f-slabL{fill:var(--slabL)} .f-slabR{fill:var(--slabR)}
.f-base{fill:var(--base)} .gridl{stroke:var(--grid);stroke-width:1.2} .gridl.plank{stroke:var(--plank,var(--grid))}
.rec{animation:rec 1.6s steps(2,start) infinite} @keyframes rec{50%{opacity:.15}}
.glint{opacity:0;animation:glint 3.4s ease-in-out infinite} @keyframes glint{0%,70%,100%{opacity:0}82%{opacity:1}}
/* Julietas: warmer jewelry workroom */
#world.t-boutique{
  --floorA:#f1dfd0; --floorB:#e3c8b3; --plank:rgba(120,70,40,.10);
  --wallB:#f9ebe7; --wallB2:#f1dad4; --wallL:#efd8d2; --wallTop:#fff8f5; --wallEnd:#dcc0b8; --wallEnd2:#d2b2a9;
  --slabL:#d8bba9; --slabR:#c8a792; --base:#e4c3b6;
  --deskT:#e7c9a6; --deskL:#d4b089; --deskR:#bd9670;
  --bwT:#d9ae86; --bwL:#c3946a; --bwR:#a97c55;
  --velT:#d86a82; --velL:#c25570; --velR:#a8455d;
  --signInk:#8a3448; --frame:#fff6f2;
}
body.night #world.t-boutique{
  --floorA:#55433f; --floorB:#483734; --plank:rgba(255,220,200,.05);
  --wallB:#5c4747; --wallB2:#533f40; --wallL:#4f3c3d; --wallTop:#6a5455; --wallEnd:#3e2f30; --wallEnd2:#38292a;
  --slabL:#3d2e2c; --slabR:#342725; --base:#4b3a39;
  --deskT:#8a6a52; --deskL:#775a45; --deskR:#644b39;
  --bwT:#8f6a4f; --bwL:#7a5942; --bwR:#654936;
  --velT:#a9566b; --velL:#94485c; --velR:#7c3b4d;
  --signInk:#f7d9df; --frame:#7d6a6c;
}
.daypatch{opacity:var(--daylight);transition:opacity .8s}
.nightonly{opacity:var(--night);transition:opacity .8s}
.dayonly{opacity:calc(1 - var(--night));transition:opacity .8s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.bot{cursor:pointer;transition:opacity .4s}
.bub,.sign{transition:opacity .4s}
.cw.enter{animation:drop .72s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes drop{0%{opacity:0;transform:translateY(-26px)}55%{opacity:1}100%{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pose{transform-box:fill-box;transform-origin:50% 100%}
.bot[data-s="activo"] .char{animation:bob 1.5s ease-in-out infinite}
.bot[data-s="activo"] .pose{animation:typing .42s ease-in-out infinite alternate}
.bot[data-s="pausado"] .char{transform:translateY(2px)}
.bot[data-s="pausado"] .pose{animation:breathe 4.6s ease-in-out infinite}
.bot[data-s="hecho"] .pose{animation:relax 5.5s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes typing{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.975)}}
@keyframes relax{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.scr{fill:var(--scrOff);transition:fill .5s}
.bot[data-s="activo"] .scr{fill:url(#scrOn)}
.bot[data-s="bloqueado"] .scr{fill:url(#scrBad)}
.bot[data-s="hecho"] .scr{fill:url(#scrDone)}
.ln{opacity:0;transform-box:fill-box;transform-origin:0 50%}
.bot[data-s="activo"] .ln{opacity:1;animation:lines 1.8s steps(6) infinite}
@keyframes lines{0%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
.spill{opacity:0;transition:opacity .8s}
body.night .bot[data-s="activo"] .spill{opacity:.9}
body.night .bot[data-s="bloqueado"] .spill{opacity:.45}
.ring{opacity:0;transition:opacity .3s}
.bot.sel .ring{opacity:1}
.ringp{transform-box:fill-box;transform-origin:50% 50%}
.bot.sel .ringp{animation:ringp 1.9s ease-out infinite}
@keyframes ringp{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.bubIn{animation:float 2.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.dt{animation:dots 1.2s ease-in-out infinite}
.dt.d2{animation-delay:.18s}.dt.d3{animation-delay:.36s}
@keyframes dots{0%,100%{opacity:.35}40%{opacity:1}}
.bub[data-s="pausado"]{opacity:.85}
/* chrome */
#top{position:fixed;top:12px;left:12px;display:flex;gap:8px;align-items:stretch;z-index:3}
.brand{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 9px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo svg{display:block}
body.night .logo rect{stroke:#1b1f29}
.brand b{font-size:13.5px;letter-spacing:-.01em;font-weight:700;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut2);display:inline-block;flex:none}
.dot.on{background:var(--activo);animation:pulse 1.9s infinite}
.dot.err{background:var(--bloqueado)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,178,91,.55)}70%{box-shadow:0 0 0 7px rgba(34,178,91,0)}100%{box-shadow:0 0 0 0 rgba(34,178,91,0)}}
.clk{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;padding-left:10px;border-left:1px solid var(--line);white-space:nowrap}
.seg{display:flex;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;font-size:12px;color:var(--mut);font-weight:550}
.seg button[aria-pressed="true"]{background:var(--panelSolid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
body.night .seg button[aria-pressed="true"]{background:rgba(255,255,255,.1)}
#counts{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px 6px;z-index:3;white-space:nowrap}
#counts span{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;color:var(--mut)}
#counts b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
#counts i{width:7px;height:7px;border-radius:50%}

#side{position:fixed;top:62px;left:12px;width:238px;display:flex;flex-direction:column;gap:8px;z-index:3;
  max-height:calc(100vh - 62px - 266px);overflow:auto;scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
#floors{padding:10px 8px 8px}
.ttl{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);padding:0 6px 6px;letter-spacing:.02em}
.fl{display:grid;grid-template-columns:22px 1fr auto;grid-template-rows:auto auto;column-gap:9px;align-items:center;width:100%;
  padding:7px 6px;border-radius:9px;transition:background .2s}
.fl:hover{background:var(--hover)}
.fl.sel{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.fl .num{grid-row:1 / span 2;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--hover);color:var(--ink2)}
.fl.sel .num{background:var(--ink);color:var(--panelSolid)}
.fl .fn{font-weight:650;font-size:13px;white-space:nowrap}
.fl .fc{grid-row:1 / span 2;grid-column:3;font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
.fl .dots{display:flex;gap:3px;margin-top:3px;grid-column:2}
.fl .dots i{width:6px;height:6px;border-radius:50%}
.fl.zero{opacity:.5}
details.card{padding:0}
details summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;font-weight:650}
details summary::-webkit-details-marker{display:none}
details summary .chev{transition:transform .2s;color:var(--mut);display:inline-block}
details[open] summary .chev{transform:rotate(180deg)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;
  background:var(--hover);color:var(--mut);margin-left:6px}
.badge.hot{background:rgba(229,83,61,.12);color:var(--bloqueado)}
.sumL{display:flex;align-items:center}
.minis{padding:0 6px 8px}
.mini{display:flex;gap:8px;align-items:flex-start;width:100%;padding:6px;border-radius:9px}
.mini:hover{background:var(--hover)}
.mini svg{flex:none}
.mini b{font-size:12.5px;display:block}
.mini span span{color:var(--mut);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.none{color:var(--mut);font-size:12px;padding:0 8px 4px}
.oth{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut2);font-weight:650;padding:8px 6px 3px;margin:4px 0 0;border-top:1px solid var(--line)}
.mini.quiet{opacity:.68}
.mini.quiet:hover{opacity:1}
.mini b em{font-style:normal;font-weight:600;color:var(--mut);font-size:10.5px;margin-left:3px}
.zh{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:680;padding:9px 8px 3px}
.zh i{width:7px;height:7px;border-radius:2px}

#right{position:fixed;top:12px;right:12px;width:322px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;z-index:3;overflow:hidden}
#rhead{padding:13px 14px 12px;color:#fff;background:linear-gradient(160deg,#35c06c,#20a457);flex:none}
#rhead.blk{background:linear-gradient(160deg,#ef6b52,#d9493a)}
#rhead.calm{background:linear-gradient(160deg,#7a8696,#5d6874)}
#rhead .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;opacity:.92}
#rhead .r1 b{font-size:13.5px}
#rhead .big{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:6px;line-height:1}
#rhead .big small{font-size:13px;font-weight:600;opacity:.92;margin-left:6px;letter-spacing:0}
#scrollR{overflow:auto;flex:1 1 auto;min-height:0}
#list{padding:6px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:10px;transition:background .2s}
.row:hover{background:var(--hover)}
.row.sel{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.row svg{display:block;margin:auto}
.row .nmr{font-weight:650;font-size:13px;display:block}
.row .sub{color:var(--mut);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .el{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;align-self:start;padding-top:2px;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.st i{width:6px;height:6px;border-radius:50%;display:inline-block}
.c-activo{color:var(--activo)} .c-pausado{color:var(--pausado)} .c-bloqueado{color:var(--bloqueado)} .c-hecho{color:var(--hecho)}
.b-activo{background:var(--activo)} .b-pausado{background:var(--pausado)} .b-bloqueado{background:var(--bloqueado)} .b-hecho{background:var(--hecho)}
#detail{border-top:1px solid var(--line);padding:12px 14px 14px}
.dh{display:flex;gap:10px;align-items:center}
.dh h3{margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--hover)}
.pill i{width:6px;height:6px;border-radius:50%;display:inline-block}
.dtask{font-size:14px;font-weight:600;margin:10px 0 3px;color:var(--ink)}
.dmeta{color:var(--mut);font-size:12px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.dsec{margin-top:9px}
.dsec h5{margin:0 0 3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650}
.dsec p{margin:0;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.dsec.blk{background:rgba(229,83,61,.08);border-radius:9px;padding:8px 10px}
.dsec.blk h5{color:var(--bloqueado)}

#log{position:fixed;left:12px;bottom:12px;width:300px;max-height:244px;padding:10px 6px 6px;z-index:3;display:flex;flex-direction:column}
#log ul{list-style:none;margin:0;padding:0;overflow:auto;scrollbar-width:thin}
#log li{display:grid;grid-template-columns:36px 1fr;gap:6px;padding:4px 6px;font-size:12px;color:var(--ink2)}
#log time{color:var(--mut2);font-variant-numeric:tabular-nums}
#log li b{font-weight:650;color:var(--ink)}
#log li span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:6px 10px;
  font-size:11.5px;color:var(--mut);z-index:3;white-space:nowrap}
.kb{display:inline-block;padding:1px 6px;border-radius:6px;background:var(--hover);color:var(--ink2);font-weight:600;font-size:11px;border:1px solid var(--line)}
.sep{width:1px;height:14px;background:var(--line)}
@media (max-width: 1180px) and (min-width: 821px){ #hint .desk{display:none} #counts span{padding:4px 5px} }

/* mobile */
@media (max-width: 820px){
  html,body{height:auto}
  body{overflow-x:hidden;overflow-y:auto}
  #app{display:flex;flex-direction:column;gap:10px;padding:10px 10px calc(18px + env(safe-area-inset-bottom))}
  #top,#counts,#side,#right,#log,#hint{position:static;transform:none;width:auto;max-height:none}
  #side,#right,#scrollR{display:contents}
  #top{order:1;flex-wrap:wrap}
  .brand{flex:1 1 auto;min-width:0;flex-wrap:wrap;row-gap:2px}
  .clk{margin-left:auto;border:0;padding-left:0}
  #counts{order:2;justify-content:space-between;padding:4px;overflow-x:auto}
  #counts span{padding:4px 5px;font-size:11.5px;gap:5px}
  #floors{order:3;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;scrollbar-width:none}
  #floors::-webkit-scrollbar{display:none}
  #floors .ttl{display:none}
  .fl{display:flex;flex:none;width:auto;gap:7px;padding:6px 11px 6px 6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 10px rgba(30,38,52,.06)}
  .fl.sel{background:var(--ink);color:var(--panelSolid)}
  .fl.sel .num{background:var(--panelSolid);color:var(--ink)}
  .fl.sel .fc{color:inherit;opacity:.75}
  .fl .num{width:20px;height:20px;border-radius:50%}
  .fl .dots{display:none}
  #stage{order:4;position:relative;inset:auto;height:60vh;min-height:360px;max-height:620px;border-radius:18px;
    touch-action:pan-y;box-shadow:inset 0 0 0 1px var(--line);flex:none}
  #zoom{right:10px;bottom:10px}

  "ux":              { c:"#6c4fe0", sh:"hex" },
  "growth":          { c:"#f5932a", sh:"capsule" },

/* ---------- isometric projection ---------- */
const S = 44, C = Math.cos(Math.PI / 6), SN = 0.5, H = 4.2, T = 0.45, WT = 0.22;
let W = 24.2, D = 17.4, MINX = 0, MINY = 0, SVGW = 0, SVGH = 0;
function bounds(){

const f1 = n => (Math.round(n * 10) / 10).toString();
const pts = arr => arr.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
const Q = list => pts(list.map(a => P(a[0], a[1], a[2])));
// planar transforms: floor (u=+x, v=+y), back wall y=const (u=+x, v=down), left wall x=const (u=-y, v=down)
function M(kind, x, y, z){

  const left  = Q([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]]);
  const top   = Q([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]]);
  return `<polygon points="${right}" ${fs(c[2], r)}/><polygon points="${left}" ${fs(c[1], r)}/><polygon points="${top}" ${fs(c[0], r)}/>`;
}
const DESK = ["var(--deskT)", "var(--deskL)", "var(--deskR)"];
const CHAIR = ["var(--chT)", "var(--chL)", "var(--chR)"];
const DARK = ["var(--dark1)", "var(--dark2)", "var(--dark3)"];
const WOOD = ["var(--woodT)", "var(--woodL)", "var(--woodR)"];
const SOFA = ["var(--sofaT)", "var(--sofaL)", "var(--sofaR)"];

/* ---------- convex solids with soft lighting ---------- */
const nrm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const VIEW = nrm([1, 1, 1.15]), LIGHT = nrm([-0.3, 0.62, 1]);
function solid(verts, faces, base, proj, sw){
  const cen = [0, 0, 0]; verts.forEach(v => { cen[0] += v[0]; cen[1] += v[1]; cen[2] += v[2]; });
  cen[0] /= verts.length; cen[1] /= verts.length; cen[2] /= verts.length;
  const dark = mix(base, "#0b0d12", .46), light = mix(base, "#ffffff", .42);
  const out = []; let minY = Infinity;
  faces.forEach(f => {
    const p = f.map(i => verts[i]), a = p[0], b = p[1], c = p[2];
    const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]], v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];

    if (n[0]*(fc[0]-cen[0]) + n[1]*(fc[1]-cen[1]) + n[2]*(fc[2]-cen[2]) < 0) n = [-n[0], -n[1], -n[2]];

function ringV(n, r, z, rot){ const a = []; for (let i = 0; i < n; i++){ const t = rot + i * 2 * Math.PI / n; a.push([r * Math.cos(t), r * Math.sin(t), z]); } return a; }

function shapeSVG(id, x, y){

    case "pent": return R(prism(5, .42, .7, 8 * R2D), 2.5);

        `<ellipse cx="${f1(x + rx*.72)}" cy="${f1(cy - ry*.35)}" rx="${f1(rx*.26)}" ry="${f1(ry*.5)}" fill="${d}" transform="rotate(-18 ${f1(x + rx*.72)} ${f1(cy - ry*.35)})"/>` +

  slots.forEach((slot, i) => {
    const key = fid + ":" + slot.b.id;
    slot.enter = !seen.has(key);
    const r = deskSVG(slot, i), st = statusOf(slot.b);
    desks += r.svg;
    bubs += `<g class="bub" data-bot="${i}" data-s="${st}" transform="translate(${f1(r.bubAt[0])} ${f1(r.bubAt[1])})"><g class="bubIn" style="animation-delay:-${((hash(slot.b.id) % 2600) / 1000).toFixed(2)}s">${bubbleInner(st)}</g></g>`;
    meta.push({ id: slot.b.id, key, zone: slot.zone, lab: r.lab, center: r.center, s: st });
    x0 = Math.min(x0, slot.dx); y0 = Math.min(y0, slot.dy); x1 = Math.max(x1, slot.dx + 1.8); y1 = Math.max(y1, slot.dy + 2.1);
  });
  deskCenter = slots.length ? P((x0 + x1) / 2, (y0 + y1) / 2, .6) : P(W / 2, D / 2, .4);
  world.innerHTML = staticDefs() + `<g>${shell(floor)}</g><g>${zd.back}</g><g>${dec.b}</g><g id="signs">${zd.signs}</g><g id="desks">${desks}</g><g>${dec.f}</g><g id="bubs">${bubs}</g>`;
  labelsEl.innerHTML = meta.map((m, i) => `<div class="nm" data-bot="${i}"><i></i><span></span></div>`).join("");
  const gs = world.querySelectorAll("#desks > .bot"), bs = world.querySelectorAll("#bubs > .bub"), ls = labelsEl.querySelectorAll(".nm");
  recs = new Map();
  meta.forEach((m, i) => {
    recs.set(m.id, { g: gs[i], bub: bs[i], bubIn: bs[i].firstElementChild, label: ls[i], s: m.s, lab: m.lab, center: m.center });
    seen.add(m.key);
  });
  slotOrder = slots.map(sl => sl.b.id);
  const tvD = document.getElementById("tvDots");
  if (tvD){
    const n = slots.length, gap = n > 6 ? 11 : 14, sz = n > 6 ? 8 : 10;
    tvD.innerHTML = slots.map((sl, i) => `<rect class="tvd" x="${i * gap}" y="0" width="${sz}" height="${sz}" rx="2.5" fill="#ffffff" opacity=".12"/>`).join("");
  }
  signature = sigOf(fid);
  updateClockHands();
}

/* ---------- in-place updates (same floor + same ids: nothing is rebuilt) ---------- */
const ST_COL = { activo: "#22b25b", pausado: "#e09d2f", bloqueado: "#e5533d", hecho: "#2a9d8f" };
function updateScene(){
  const onFloor = slotOrder.map(id => bots.find(b => b.id === id)).filter(Boolean);
  onFloor.forEach(b => {
    const r = recs.get(b.id); if (!r) return;
    const s = statusOf(b);
    if (r.s !== s){ r.g.setAttribute("data-s", s); r.bub.setAttribute("data-s", s); r.bubIn.innerHTML = bubbleInner(s); r.s = s; }
    const full = b.name || b.id, nm = currentFloor === "shorts" ? full.replace(/^Shorts\s+/i, "") : full;
    const span = r.label.lastElementChild, dot = r.label.firstElementChild;
    if (span.textContent !== nm) span.textContent = nm;
    if (dot.className !== "b-" + s) dot.className = "b-" + s;

    r.g.classList.toggle("sel", sel); r.label.classList.toggle("sel", sel);

/* ---------- selection & floor switching ---------- */
function defaultSelection(){
  const cur = bots.find(b => b.id === selectedId);
  if (cur && floorOf(cur.id) === currentFloor) return;
  const ord = floorOrdered(currentFloor);
  const pick = ord.find(b => b.status === "activo") || ord.find(b => b.status === "bloqueado") || ord[0];
  selectedId = pick ? pick.id : null;
}
function select(id, pan){
  const b = bots.find(x => x.id === id); if (!b) return;
  selectedId = id;
  if (floorOf(id) !== currentFloor){ goFloor(floorOf(id)); return; }
  updateScene(); renderPanels();
  const r = recs.get(id);
  if (pan && r) panToIfHidden(r.center);
}
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let swapT = 0;
function goFloor(fid){
  if (!FLOOR_BY[fid]) fid = "tabner";
  const chipScroll = () => { const chip = document.querySelector(".fl.sel"); if (chip && isMobile()) chip.scrollIntoView({ inline: "center", block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" }); };
  if (fid === currentFloor && !swapping){ fit(true); chipScroll(); return; }
  currentFloor = fid;
  try { history.replaceState(null, "", "#" + fid); } catch (_) {}
  defaultSelection(); renderPanels(); renderEmpty(); chipScroll();
  tip.hidden = true;
  const swap = () => { buildScene(currentFloor); fit(false); updateScene(); stage.classList.remove("swap"); swapping = false; };
  clearTimeout(swapT);
  if (reduceMotion()){ swap(); return; }
  swapping = true; stage.classList.add("swap");
  swapT = setTimeout(swap, 170);
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (FLOOR_BY[h] && h !== currentFloor) goFloor(h); });

/* ---------- pan / zoom ---------- */
const view = { k: 1, tx: 0, ty: 0 }; let kFit = 1;
const isMobile = () => window.matchMedia("(max-width: 820px)").matches;
function area(){
  const r = stage.getBoundingClientRect();
  if (isMobile()) return { w: r.width, h: r.height, l: 0, t: 0, aw: r.width, ah: r.height };
  const l = Math.min(262, r.width * .2), rr = Math.min(346, r.width * .27), t = 56, b = 44;
  return { w: r.width, h: r.height, l, t, aw: Math.max(200, r.width - l - rr), ah: Math.max(200, r.height - t - b) };
}
let easeT = 0;
function apply(ease){
  world.classList.toggle("ease", !!ease); labelsEl.classList.toggle("ease", !!ease);
  world.style.transform = `translate(${view.tx.toFixed(1)}px, ${view.ty.toFixed(1)}px) scale(${view.k.toFixed(4)})`;
  placeLabels();
  clearTimeout(easeT);
  if (ease) easeT = setTimeout(() => { world.classList.remove("ease"); labelsEl.classList.remove("ease"); }, 700);
}
function placeLabels(){
  recs.forEach(r => {
    const x = view.tx + r.lab[0] * view.k, y = view.ty + r.lab[1] * view.k;
    r.label.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, 0)`;
  });
}
function clampView(){
  const a = area();
  view.tx = Math.min(a.w * .75, Math.max(a.w * .25 - SVGW * view.k, view.tx));
  view.ty = Math.min(a.h * .75, Math.max(a.h * .25 - SVGH * view.k, view.ty));
}
function fit(ease){
  const a = area();
  if (isMobile()){
    const kAll = Math.min(a.w / SVGW, a.h / SVGH);
    kFit = Math.max(kAll, Math.min(a.h / (SVGH * .9), a.w / (SVGW * .66)));
    const c = deskCenter || [SVGW / 2, SVGH / 2];
    view.k = kFit; view.tx = a.w / 2 - c[0] * kFit; view.ty = a.h / 2 - (c[1] - 20) * kFit;
  } else {
    kFit = Math.min(1.15, Math.min(a.aw / SVGW, a.ah / SVGH) * 1.1);
    view.k = kFit; view.tx = a.l + a.aw / 2 - SVGW * kFit / 2; view.ty = a.t + a.ah / 2 - SVGH * kFit / 2 + 6;
  }
  clampView(); apply(ease);
}
function centerOn(p, k){
  const a = area();
  view.k = Math.max(kFit * .6, Math.min(kFit * 3.2, k || view.k));
  view.tx = a.l + a.aw / 2 - p[0] * view.k; view.ty = a.t + a.ah / 2 - p[1] * view.k;
  clampView(); apply(true);
}
function panToIfHidden(p){
  const a = area(), x = view.tx + p[0] * view.k, y = view.ty + p[1] * view.k;
  if (x < a.l + 40 || x > a.l + a.aw - 40 || y < a.t + 50 || y > a.t + a.ah - 40) centerOn(p, view.k);
}
function zoomAt(px, py, factor){
  const k2 = Math.max(kFit * .6, Math.min(kFit * 3.2, view.k * factor));
  view.tx = px - (px - view.tx) * (k2 / view.k); view.ty = py - (py - view.ty) * (k2 / view.k); view.k = k2;
  clampView(); apply(false);
}
const pointers = new Map(); let dragged = false, pinch = null, downAt = null;
stage.addEventListener("pointerdown", e => {
  if (e.button > 0 || e.target.closest("#zoom")) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){ dragged = false; downAt = { x: e.clientX, y: e.clientY }; }
  if (pointers.size === 2){ const p = [...pointers.values()]; pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, k: view.k }; }
});
window.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)){ hover(e); return; }
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){
    if (!dragged && downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5){ dragged = true; stage.classList.add("grabbing"); tip.hidden = true; }
    if (dragged){ view.tx += e.clientX - prev.x; view.ty += e.clientY - prev.y; clampView(); apply(false); }
  } else if (pointers.size === 2 && pinch){
    dragged = true;
    const p = [...pointers.values()], d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), r = stage.getBoundingClientRect();
    zoomAt((p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top, (pinch.k * d / pinch.d) / view.k);
  }
});
function endPointer(e){ pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) stage.classList.remove("grabbing"); }
window.addEventListener("pointerup", endPointer);
window.addEventListener("pointercancel", endPointer);
stage.addEventListener("click", e => { if (dragged){ e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
stage.addEventListener("wheel", e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0016)));
}, { passive: false });
$("#zoom").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = area(), z = b.getAttribute("data-z");
  if (z === "fit") fit(true);
  else zoomAt(a.l + a.aw / 2, a.t + a.ah / 2, z === "in" ? 1.3 : 1 / 1.3);
});
function botFromEl(el){
  const t = el && el.closest ? el.closest("[data-bot]") : null; if (!t) return null;
  const id = slotOrder[Number(t.getAttribute("data-bot"))];
  return bots.find(b => b.id === id) || null;
}
stage.addEventListener("click", e => { const b = botFromEl(e.target); if (b) select(b.id, false); });
function hover(e){
  if (e.pointerType !== "mouse" || pointers.size) return;
  const b = stage.contains(e.target) ? botFromEl(e.target) : null;
  if (!b){ if (!tip.hidden) tip.hidden = true; return; }
  const r = stage.getBoundingClientRect();
  tip.innerHTML = `<b>${escapeHtml(b.name || b.id)} · ${escapeHtml(labelOf(b))}</b><span>${plain(b.task || "Sin tarea")}</span>`;
  tip.hidden = false;
  const x = Math.min(r.width - 250, e.clientX - r.left + 14), y = Math.min(r.height - 60, e.clientY - r.top + 16);

}
document.addEventListener("click", e => {
  const fl = e.target.closest(".fl"); if (fl){ goFloor(fl.getAttribute("data-floor")); return; }
  const row = e.target.closest(".row, .mini");
  if (row){ const id = row.getAttribute("data-id"); const b = bots.find(x => x.id === id); if (b) select(b.id, true); }

let rz = 0; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => fit(false), 120); });

/* ---------- day / night ---------- */

  if (t !== "day" && t !== "night"){ const h = madridNow().h; t = (h >= 20 || h < 7) ? "night" : "day"; }

/* ---------- clock ---------- */
function updateClockHands(){
  const n = madridNow(), set = (id, deg) => { const el = document.getElementById(id); if (el) el.setAttribute("transform", `rotate(${deg.toFixed(1)})`); };
  set("hH", (n.h % 12) * 30 + n.m * .5); set("hM", n.m * 6 + n.s * .1); set("hS", n.s * 6);
}
function clockTick(){ $("#clock").textContent = fmtClock.format(new Date()) + " Madrid"; updateClockHands(); }

/* ---------- data ---------- */
let firstFit = true;
function render(data){
  lastData = data || {};
  const raw = Array.isArray(lastData.bots) ? lastData.bots : [], ids = new Set();
  bots = [];
  raw.forEach(b => { if (b && b.id != null && !ids.has(String(b.id))){ ids.add(String(b.id)); bots.push(Object.assign({}, b, { id: String(b.id) })); } });
  defaultSelection();
  if (!swapping && sigOf(currentFloor) !== signature){
    buildScene(currentFloor);
    if (firstFit){ firstFit = false; fit(false); } else { clampView(); apply(false); }
  }
  updateScene(); renderPanels(); renderFoot(); renderEmpty();
}
let inFlight = false;
async function tick(){
  if (inFlight) return; inFlight = true;
  try {
    const res = await fetch(src + (src.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    hasData = true;
    render(data);
    $("#dot").className = "dot on"; $("#conn").textContent = "En vivo";
  } catch (err) {
    $("#dot").className = "dot err";
    $("#conn").textContent = hasData ? "Sin red, última foto" : "Sin datos todavía";
    if (!hasData) renderEmpty();
  } finally { inFlight = false; }
}

// paint the empty room of the landing floor at once so the page is never blank, then go live
buildScene(currentFloor); fit(false); signature = "\u0000";
updateScene(); renderPanels(); renderFoot(); renderEmpty();
clockTick(); setInterval(clockTick, 1000);
setInterval(() => { if (hasData) renderPanels(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
tick();
setInterval(tick, intervalSec * 1000);
})();
</script>
